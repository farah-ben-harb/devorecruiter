<div
  class="flex items-end gap-2 p-2 sm:p-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900"
>
  <textarea
    [(ngModel)]="message"
    (keydown)="onKeyDown($event)"
    [disabled]="isLoading"
    placeholder="Posez votre question technique..."
    rows="1"
    class="flex-1 resize-none rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E2001A] disabled:opacity-50 transition-all"
  ></textarea>

  <button
    (click)="onSend()"
    [disabled]="!message().trim() || isLoading"
    class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-[#E2001A] text-white transition-all duration-200 shrink-0 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-red-700"
  >
    @if (isLoading) {
      <svg class="animate-spin w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path
          d="M22 2L11 13"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M22 2L15 22L11 13L2 9L22 2Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  </button>
</div>

<div
  class="h-[calc(100dvh-9rem)] min-h-[70vh] flex flex-col overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 shadow-lg bg-white dark:bg-gray-900"
>
  <!-- En-tête -->
  <div
    class="flex items-center gap-3 px-3 pt-3 pb-3 border-b border-gray-200 dark:border-gray-700 w-full"
  >
    <button
      (click)="toggleSidebar()"
      class="md:hidden flex items-center justify-center w-9 h-9 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors shrink-0"
      aria-label="Toggle sidebar"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path
          d="M3 6h18M3 12h18M3 18h18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <h1 class="text-lg sm:text-2xl font-bold text-gray-800 dark:text-white truncate">
      Assistant technique
    </h1>
  </div>

  <!-- Corps -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Overlay mobile -->
    @if (sidebarOpen()) {
      <button
        (click)="closeSidebar()"
        aria-label="Fermer la barre latérale"
        class="absolute inset-0 z-30 bg-black/50 md:hidden"
      ></button>
    }

    <!-- Sidebar -->
    <div
      class="absolute md:static top-0 bottom-0 left-0 z-40 border-r border-gray-200 dark:border-gray-700 transition-transform duration-200 ease-out md:translate-x-0"
      [class.-translate-x-full]="!sidebarOpen()"
      [class.translate-x-0]="sidebarOpen()"
    >
      <app-conversation-sidebar
        [conversations]="facade.conversations()"
        [activeConversationId]="facade.activeConversationId()"
        (newConversation)="onNewConversation()"
        (conversationSelected)="onConversationSelected($event)"
        (conversationDeleted)="onConversationDeleted($event)"
        (conversationPinned)="onConversationPinned($event)"
        (conversationRenamed)="onConversationRenamed($event)"
      />
    </div>

    <!-- Zone chat -->
    <div class="flex flex-col flex-1 overflow-hidden min-w-0">
      <!-- Titre conversation active -->
      <div
        class="h-13 flex items-center px-3 sm:px-4 border-b border-gray-200 dark:border-gray-700 shrink-0"
      >
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
          <p class="text-sm font-semibold text-gray-700 dark:text-gray-200 truncate">
            {{
              facade.activeConversation()?.title ??
                'Sélectionnez une conversation ou commencez-en une nouvelle'
            }}
          </p>
        </div>
      </div>

      <app-chat-window
        [messages]="facade.activeMessages()"
        [isLoading]="facade.isLoading()"
        class="flex-1 min-h-0 block"
      />

      <app-message-input [isLoading]="facade.isLoading()" (send)="onSendMessage($event)" />
    </div>
  </div>
</div>

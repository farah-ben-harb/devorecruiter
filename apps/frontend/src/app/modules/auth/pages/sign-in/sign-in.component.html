<div class="min-h-screen bg-white dark:bg-gray-900 flex flex-col lg:flex-row">
  <!-- LEFT -->
  <div class="w-full lg:w-1/2 flex justify-center items-center px-4 sm:px-6 py-10 lg:py-0">
    <div class="w-full max-w-md flex flex-col items-center space-y-8">
      <!-- Logo -->
      <div class="text-center space-y-6">
        <img
          src="assets/images/logo_devoteam.png"
          alt="Devoteam"
          class="h-16 sm:h-20 md:h-24 mx-auto"
        />

        <div class="flex items-center justify-center gap-3">
          <div class="w-1.5 h-8 sm:h-10 rounded-full bg-brand-500"></div>
          <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-900 dark:text-white">
            DevoRecruiter
          </h2>
        </div>

        <h1 class="text-lg sm:text-xl font-semibold text-gray-800 dark:text-gray-100">Bienvenue</h1>

        <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400 px-2">
          Connectez-vous avec votre compte Google Devoteam
        </p>
      </div>

      <!-- Button -->
      <button
        (click)="loginWithGoogle()"
        class="w-full flex items-center justify-center gap-3 py-3 sm:py-4 px-5 text-sm sm:text-base font-semibold bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl shadow-md hover:shadow-lg transition"
      >
        <app-icon name="google" />
        Continuer avec Google
      </button>

      <!-- Error -->
      @if (errorMessage) {
        <div
          class="w-full p-3 sm:p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl"
        >
          <p class="text-sm text-red-600 dark:text-red-400">
            {{ errorMessage }}
          </p>
        </div>
      }

      <!-- Security -->
      <div class="text-xs text-gray-400 flex items-center gap-2 text-center">
        <app-icon name="lock" />
        Accès réservé aux collaborateurs Devoteam
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div
    class="hidden lg:flex w-1/2 relative items-center justify-center text-white bg-linear-to-br from-[#5c1a12] via-[#2d0c08] to-[#110402]"
  >
    <div class="max-w-md text-center px-6">
      <span class="text-xs font-bold px-4 py-1 bg-brand-500 rounded-full">
        SOLUTIONS ENTREPRISE
      </span>

      <h2 class="text-3xl xl:text-5xl font-bold mt-4">Recrutement intelligent IA</h2>

      <p class="mt-6 text-white/80 text-base sm:text-lg">
        Automatisation du recrutement et analyse intelligente des candidatures.
      </p>
    </div>
  </div>

  <!-- THEME TOGGLE -->
  <button
    (click)="toggleTheme()"
    class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 w-12 h-12 sm:w-14 sm:h-14 bg-brand-500 text-white rounded-full flex items-center justify-center shadow-lg"
  >
    <app-icon [name]="isDark ? 'sun' : 'moon'" />
  </button>
</div>

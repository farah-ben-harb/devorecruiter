@if (toast().visible) {
  <div
    class="fixed bottom-4 right-4 z-9999 px-6 py-4 rounded-xl shadow-lg flex items-center gap-3"
    [ngClass]="{
      'bg-green-600 text-white': toast().type === 'success',
      'bg-red-600 text-white': toast().type === 'error',
      'bg-blue-600 text-white': toast().type === 'info',
    }"
    role="status"
    aria-live="polite"
  >
    <div class="w-8 h-8 flex items-center justify-center rounded-full text-lg font-bold">
      @if (toast().type === 'success') {
        ✓
      } @else if (toast().type === 'error') {
        ✕
      } @else {
        i
      }
    </div>

    <div>
      <p class="font-medium">
        @if (toast().type === 'success') {
          Succès
        } @else if (toast().type === 'error') {
          Erreur
        } @else {
          Information
        }
      </p>

      <p class="text-sm text-white/90">
        {{ toast().message }}
      </p>
    </div>

    <button
      (click)="dismiss.emit()"
      class="ml-4 text-white/60 hover:text-white"
      aria-label="Fermer la notification"
    >
      ✕
    </button>
  </div>
}

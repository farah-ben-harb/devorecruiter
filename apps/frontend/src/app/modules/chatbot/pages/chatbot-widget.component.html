<div class="chatbot-container">
  <!-- Bouton flottant FAB -->
  <button
    class="chatbot-fab"
    (click)="facade.toggleChat()"
    [class.open]="facade.isOpen()"
    aria-label="Ouvrir l'assistant"
  >
    <svg
      *ngIf="!facade.isOpen()"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
    <svg
      *ngIf="facade.isOpen()"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>

  <!-- Fenêtre du chat -->
  <div class="chatbot-window" [class.visible]="facade.isOpen()">
    <!-- Header -->
    <div class="chatbot-header">
      <div class="header-info">
        <div class="avatar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"
            />
          </svg>
        </div>
        <div>
          <span class="header-title">Assistant DevoRecruiter</span>
          <span class="header-status">En ligne</span>
        </div>
      </div>
      <button class="btn-clear" (click)="facade.clearHistory()" title="Nouvelle conversation">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 .49-3.85" />
        </svg>
      </button>
    </div>

    <!-- Zone messages -->
    <div class="chatbot-messages" #messagesContainer>
      <!-- Message de bienvenue si pas de messages -->
      <div *ngIf="facade.messages().length === 0" class="welcome">
        <div class="welcome-icon">👋</div>
        <p class="welcome-title">Bonjour ! Je suis votre assistant.</p>
        <p class="welcome-sub">
          Posez-moi n'importe quelle question sur vos données de recrutement.
        </p>
        <div class="suggestions">
          <button
            *ngFor="let q of suggestedQuestions"
            class="suggestion-btn"
            (click)="sendSuggestion(q)"
          >
            {{ q }}
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div
        *ngFor="let msg of facade.messages()"
        class="message-row"
        [class.user-row]="msg.role === 'user'"
        [class.assistant-row]="msg.role === 'assistant'"
      >
        <div
          class="message-bubble"
          [class.user-bubble]="msg.role === 'user'"
          [class.assistant-bubble]="msg.role === 'assistant'"
        >
          <!-- Indicateur de chargement -->
          <div *ngIf="msg.isLoading" class="typing-dots">
            <span></span><span></span><span></span>
          </div>

          <!-- Contenu du message -->
          <p *ngIf="!msg.isLoading" class="message-text">{{ msg.content }}</p>

          <span *ngIf="!msg.isLoading" class="message-time">{{ formatTime(msg.timestamp) }}</span>
        </div>
      </div>
    </div>

    <!-- Erreur -->
    <div *ngIf="facade.error()" class="error-bar">
      {{ facade.error() }}
    </div>

    <!-- Zone de saisie -->
    <div class="chatbot-input">
      <textarea
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
        placeholder="Posez votre question..."
        [disabled]="facade.isLoading()"
        rows="1"
        class="input-field"
      ></textarea>
      <button
        class="send-btn"
        (click)="send()"
        [disabled]="facade.isLoading() || !inputText().trim()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>
</div>

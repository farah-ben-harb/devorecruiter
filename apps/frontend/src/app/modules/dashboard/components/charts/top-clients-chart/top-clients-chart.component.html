<div
  class="bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-4 shadow-sm"
>
  <h2 class="text-xs font-bold text-gray-600 dark:text-gray-300 mb-4 flex items-center gap-2">
    <span class="w-1 h-3.5 bg-blue-500 rounded-full"></span>
    Top clients
  </h2>
  @if (bars().length > 0) {
    <div class="flex items-end justify-around gap-2 h-36">
      @for (bar of bars(); track bar.label) {
        <div class="flex flex-col items-center gap-1 flex-1 h-full justify-end group">
          <span class="text-[11px] font-bold text-gray-600 dark:text-white">{{ bar.count }}</span>
          <div
            class="w-full rounded-t transition-all duration-700 ease-out group-hover:opacity-75"
            [style.height.%]="bar.pct"
            [style.min-height]="'6px'"
            [style.background]="bar.color"
          ></div>
          <span
            class="text-[9px] text-gray-400 text-center leading-tight w-full break-words line-clamp-2"
            [title]="bar.label"
          >
            {{ bar.label }}
          </span>
        </div>
      }
    </div>
  } @else {
    <div class="h-36 flex items-center justify-center text-gray-300 italic text-sm">
      Aucun client enregistré
    </div>
  }
</div>

<div
  class="h-full bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-3 shadow-sm flex flex-col overflow-hidden"
>
  <h2
    class="text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-tight mb-2 shrink-0"
  >
    Conversations récentes
  </h2>
  @if (conversations().length > 0) {
    <div class="overflow-y-auto space-y-1.5 pr-1 max-h-60">
      @for (conv of conversations().slice(0, 4); track conv.id) {
        <div
          (click)="navigate.emit(conv.id)"
          (keyup.enter)="navigate.emit(conv.id)"
          role="button"
          tabindex="0"
          class="flex items-center justify-between p-2 rounded-xl border border-gray-100 dark:border-gray-800 hover:border-violet-200 dark:hover:border-violet-800 hover:bg-violet-50 dark:hover:bg-violet-900/10 transition-all cursor-pointer group"
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded-lg bg-violet-50 dark:bg-violet-900/30 flex items-center justify-center text-xs shrink-0 group-hover:bg-violet-100 transition-colors"
            >
              💬
            </div>
            <div class="min-w-0">
              <p class="text-xs font-semibold text-gray-700 dark:text-gray-200 truncate">
                {{ conv.title }}
              </p>
              <p class="text-[10px] text-gray-400">
                {{ conv.updatedAt | date: 'dd/MM/yy' }} · {{ conv.messageCount }} msg
              </p>
            </div>
          </div>
          <span
            class="text-gray-300 group-hover:text-violet-400 transition-colors text-xs shrink-0 ml-1"
            >→</span
          >
        </div>
      }
    </div>
  } @else {
    <div class="flex-1 flex items-center justify-center text-gray-300 italic text-xs">
      Aucune conversation
    </div>
  }
</div>

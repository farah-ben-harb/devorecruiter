<div
  (click)="navigate()"
  (keyup.enter)="navigate()"
  role="button"
  tabindex="0"
  class="h-full bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-5 hover:border-blue-300 dark:hover:border-blue-700 hover:shadow-md transition-all cursor-pointer group"
>
  <div class="flex items-center gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-xl group-hover:bg-blue-100 transition-colors"
    >
      📄
    </div>
    <p class="text-sm font-bold text-gray-700 dark:text-gray-200">Fiches de poste</p>
  </div>

  <div class="space-y-2 mb-4">
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Total</span>
      <span class="text-sm font-bold text-gray-800 dark:text-white">{{ stats()?.total ?? 0 }}</span>
    </div>
    <div class="w-full h-px bg-gray-100 dark:bg-gray-800"></div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Brutes</span>
      <span class="text-xs font-semibold text-gray-500 dark:text-gray-400">{{
        stats()?.bruts ?? 0
      }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Unifiées</span>
      <span class="text-xs font-semibold text-emerald-600">{{ stats()?.unifies ?? 0 }}</span>
    </div>
  </div>

  <div class="w-full h-px bg-gray-100 dark:bg-gray-800 mb-3"></div>

  <div class="space-y-3">
    @for (item of items(); track item.label) {
      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-gray-500 dark:text-gray-400">{{ item.label }}</span>
          <span class="text-xs font-bold text-gray-800 dark:text-white">{{ item.value }}</span>
        </div>
        <div class="w-full bg-gray-100 dark:bg-gray-800 h-2 rounded-full overflow-hidden">
          <div
            class="h-full rounded-full transition-all duration-700 ease-out"
            [style.width.%]="item.pct"
            [style.background]="item.color"
          ></div>
        </div>
      </div>
    }
  </div>
</div>

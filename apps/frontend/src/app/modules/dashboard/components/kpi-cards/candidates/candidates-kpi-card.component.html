<div
  (click)="navigate()"
  (keyup.enter)="navigate()"
  role="button"
  tabindex="0"
  class="h-full bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-5 hover:border-emerald-300 dark:hover:border-emerald-700 hover:shadow-md transition-all cursor-pointer group"
>
  <div class="flex items-center gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center text-xl group-hover:bg-emerald-100 transition-colors"
    >
      👤
    </div>
    <p class="text-sm font-bold text-gray-700 dark:text-gray-200">Candidats</p>
  </div>
  <div class="space-y-2">
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Total</span>
      <span class="text-sm font-bold text-gray-800 dark:text-white">{{ stats()?.total ?? 0 }}</span>
    </div>
    <div class="w-full h-px bg-gray-100 dark:bg-gray-800"></div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">CVs bruts</span>
      <span class="text-xs font-semibold text-gray-500 dark:text-gray-400">{{
        stats()?.bruts ?? 0
      }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">CVs unifiés</span>
      <span class="text-xs font-semibold text-emerald-600">{{ stats()?.unifies ?? 0 }}</span>
    </div>
  </div>
</div>

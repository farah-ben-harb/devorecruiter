<div
  class="h-full bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-5"
>
  <div class="flex items-center gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-xl bg-purple-50 dark:bg-purple-900/30 flex items-center justify-center text-xl"
    >
      📨
    </div>
    <p class="text-sm font-bold text-gray-700 dark:text-gray-200">Invitations</p>
  </div>
  <div class="space-y-2">
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Total</span>
      <span class="text-sm font-bold text-gray-800 dark:text-white">{{ stats?.total ?? 0 }}</span>
    </div>
    <div class="w-full h-px bg-gray-100 dark:bg-gray-800"></div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Envoyées</span>
      <span class="text-xs font-semibold text-blue-500">{{ stats?.sent ?? 0 }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Soumises</span>
      <span class="text-xs font-semibold text-emerald-600">{{ stats?.submitted ?? 0 }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Expirées</span>
      <span class="text-xs font-semibold text-red-500">{{ stats?.expired ?? 0 }}</span>
    </div>
  </div>
</div>

<div
  (click)="navigate()"
  (keyup.enter)="navigate()"
  role="button"
  tabindex="0"
  class="h-full bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-5 hover:border-amber-300 dark:hover:border-amber-700 hover:shadow-md transition-all cursor-pointer group"
>
  <div class="flex items-center gap-3 mb-4">
    <div
      class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-900/30 flex items-center justify-center text-xl group-hover:bg-amber-100 transition-colors"
    >
      🧪
    </div>
    <p class="text-sm font-bold text-gray-700 dark:text-gray-200">Évaluations techniques</p>
  </div>
  <div class="space-y-2">
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Total</span>
      <span class="text-sm font-bold text-gray-800 dark:text-white">{{ stats()?.total ?? 0 }}</span>
    </div>
    <div class="w-full h-px bg-gray-100 dark:bg-gray-800"></div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">En cours</span>
      <span class="text-xs font-semibold text-amber-500">{{ stats()?.enCours ?? 0 }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Validées</span>
      <span class="text-xs font-semibold text-emerald-600">{{ stats()?.validees ?? 0 }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">Rejetées</span>
      <span class="text-xs font-semibold text-red-500">{{ stats()?.rejetees ?? 0 }}</span>
    </div>
  </div>
</div>

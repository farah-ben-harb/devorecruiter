<div class="fixed inset-0 z-100000 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div
    class="relative w-full max-w-md bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700"
  >
    <div class="flex items-start gap-4 p-6">
      <div
        class="shrink-0 w-11 h-11 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center"
      >
        <app-icon name="trash" class="text-red-600 dark:text-red-400"></app-icon>
      </div>
      <div>
        <h4 class="text-base font-semibold text-gray-800 dark:text-white">
          Supprimer cette évaluation ?
        </h4>
        <p class="mt-1.5 text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
          Cette action est
          <span class="font-medium text-gray-700 dark:text-gray-300">irréversible</span>.
          @if (evaluationIndex()) {
            L'évaluation
            <code
              class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-xs font-mono text-gray-700 dark:text-gray-300"
            >
              #{{ evaluationIndex() }}
            </code>
            et toutes ses données seront définitivement supprimées.
          } @else {
            Cette évaluation et toutes ses données seront définitivement supprimées.
          }
        </p>
      </div>
    </div>

    <div class="flex justify-end gap-2 px-6 py-4 border-t border-gray-100 dark:border-gray-700">
      <button
        (click)="close.emit()"
        [disabled]="deleting()"
        class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition disabled:opacity-50"
      >
        Annuler
      </button>
      <button
        (click)="confirm.emit()"
        [disabled]="deleting()"
        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-red-700 hover:bg-red-800 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (deleting()) {
          <app-icon name="spinner" class="w-4 h-4 animate-spin shrink-0"></app-icon>
          Suppression...
        } @else {
          <app-icon name="trash" class="w-4 h-4 shrink-0"></app-icon>
          Supprimer
        }
      </button>
    </div>
  </div>
</div>

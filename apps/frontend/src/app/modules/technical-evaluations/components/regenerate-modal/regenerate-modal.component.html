<div
  class="fixed inset-0 z-100000 flex items-center justify-center px-3 sm:px-4 bg-black/40 backdrop-blur-sm"
>
  <div
    class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-lg"
  >
    <!-- Header -->
    <div
      class="flex items-center justify-between px-4 sm:px-6 py-4 border-b border-gray-100 dark:border-gray-700"
    >
      <div class="flex-1 min-w-0 pr-3">
        <h2 class="text-base sm:text-lg font-semibold text-gray-800 dark:text-white">
          Régénérer l'évaluation
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">
          Version actuelle :
          <span class="font-medium text-gray-600 dark:text-gray-300">{{ evaluation.version }}</span>
        </p>
      </div>
      <button
        (click)="close.emit()"
        class="shrink-0 p-2 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <app-icon name="close"></app-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="px-4 sm:px-6 py-5 space-y-4">
      <!-- Type de changement -->
      <fieldset>
        <legend class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Type de modification
        </legend>
      </fieldset>

      <!-- Prompt -->
      <div>
        <label for="prompt" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Instructions pour la régénération
        </label>
        <textarea
          id="prompt"
          [(ngModel)]="prompt"
          rows="5"
          placeholder="Ex: Ajoute une user story sur l'authentification OAuth, change le framework pour React, rends les critères d'évaluation plus stricts..."
          class="w-full px-3 sm:px-4 py-3 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#E2001A] focus:border-transparent resize-none transition"
        ></textarea>
        <p class="text-xs text-gray-400 mt-1">
          Décrivez les modifications à apporter à l'évaluation existante.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div
      class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-t border-gray-100 dark:border-gray-700"
    >
      <button
        (click)="close.emit()"
        class="w-full sm:w-auto px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition"
      >
        Annuler
      </button>
      <button
        (click)="submit()"
        [disabled]="!prompt.trim() || regenerating"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#E2001A] text-white text-sm font-medium rounded-lg hover:bg-red-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (regenerating) {
          <app-icon name="spinner" class="w-4 h-4 animate-spin"></app-icon> Génération...
        } @else {
          <app-icon name="refresh" class="w-4 h-4"></app-icon> Régénérer
        }
      </button>
    </div>
  </div>
</div>
